name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "Sources/**"
      - "Tests/**"
      - "Package.swift"
      - ".github/workflows/build-android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle --no-daemon -Pkotlin.jvm.target.validation.mode=warning -p android :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-droid-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SwiftUI source
        run: swift test

  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            mkdir -p island-screenshots
            gradle --no-daemon -p android :notification-fixture:assembleDebug
            adb install -r android/notification-fixture/build/outputs/apk/debug/notification-fixture-debug.apk
            adb shell pm grant com.dynamicdroid.fixture android.permission.POST_NOTIFICATIONS
            gradle --no-daemon -p android :app:connectedDebugAndroidTest
            adb pull /sdcard/Pictures/IslandSmoke island-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: island-render-checks
          path: |
            island-screenshots
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: gradle --no-daemon -p android :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.dynamicdroid.app.DeviceCompatibilityTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-api-${{ matrix.api }}
          path: android/app/build/outputs/androidTest-results
