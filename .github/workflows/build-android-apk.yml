name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Only run these instrumented tests (class or class#method); empty runs all"
        required: false
        default: ""
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Build APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace -Pkotlin.jvm.target.validation.mode=warning -p android :app:testStandardDebugUnitTest :app:assembleStandardDebug :app:assembleAndroid17Debug :app:assembleStandardPerformance :app:assembleAndroid17Performance :notification-fixture:assembleDebug 2>&1 | tee gradle.log || {
            # GitHub shows at most 10 annotations per step, so send one combined summary.
            summary=$(grep -vE "^> Task " gradle.log | grep -E -A4 "^e: |FAILED|What went wrong|Caused by|OutOfMemory|error:" | grep -vE "^> Task " | head -40 | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error title=Gradle build failed::${summary:0:3800}"
            exit 1
          }

      # Standard: the current build (targets Android 15, runs on Android 8 to 17).
      - uses: actions/upload-artifact@v6
        with:
          name: dynamic-droid-debug-apk
          path: android/app/build/outputs/apk/standard/debug/app-standard-debug.apk

      - uses: actions/upload-artifact@v6
        with:
          name: dynamic-droid-optimized-apk
          path: android/app/build/outputs/apk/standard/performance/app-standard-performance.apk

      # Android 17: the same app built for Android 17's rules.
      - uses: actions/upload-artifact@v6
        with:
          name: dynamic-droid-android17-debug-apk
          path: android/app/build/outputs/apk/android17/debug/app-android17-debug.apk

      - uses: actions/upload-artifact@v6
        with:
          name: dynamic-droid-android17-optimized-apk
          path: android/app/build/outputs/apk/android17/performance/app-android17-performance.apk

      - uses: actions/upload-artifact@v6
        with:
          name: notification-fixture-apk
          path: android/notification-fixture/build/outputs/apk/debug/notification-fixture-debug.apk

  render:
    runs-on: ubuntu-latest
    # The emulator suite runs 14-17 minutes; leave room for a slow runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            mkdir -p island-screenshots
            gradle --no-daemon -p android :notification-fixture:assembleDebug
            adb install -r android/notification-fixture/build/outputs/apk/debug/notification-fixture-debug.apk
            adb shell pm grant com.dynamicdroid.fixture android.permission.POST_NOTIFICATIONS
            gradle --no-daemon -p android :app:connectedStandardDebugAndroidTest ${{ inputs.tests && format('-Pandroid.testInstrumentationRunnerArguments.class={0} -Pandroid.testInstrumentationRunnerArguments.report=1', inputs.tests) || '' }}
            adb pull /sdcard/Pictures/IslandSmoke island-screenshots
      - name: Report failed instrumentation tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("android/app/build/outputs/androidTest-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for f in list(case.iter("failure")) + list(case.iter("error")):
                      text = (f.get("message") or f.text or "").strip().splitlines()
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{' | '.join(text[:6])[:900]}")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: island-render-checks
          path: |
            island-screenshots
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, flavor: Standard, target: default }
          - { api: 30, flavor: Standard, target: default }
          - { api: 37, flavor: Android17, target: google_apis }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Find the system image
        id: img
        # Newer SDK packages carry a minor version (android-37.0), older ones do not (android-30).
        run: |
          name=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
            | grep -oE "system-images;android-${{ matrix.api }}(\.[0-9]+)?;${{ matrix.target }};x86_64" | sort -V | tail -1)
          level=$(echo "$name" | cut -d';' -f2 | sed 's/^android-//')
          echo "Using ${name:-${{ matrix.api }}} (level ${level:-${{ matrix.api }}})"
          echo "level=${level:-${{ matrix.api }}}" >> "$GITHUB_OUTPUT"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.img.outputs.level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          # Android 17 images need at least 4 GB.
          ram-size: 4096M
          disable-animations: false
          script: gradle --no-daemon -p android :app:connected${{ matrix.flavor }}DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.dynamicdroid.app.DeviceCompatibilityTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compatibility-api-${{ matrix.api }}-${{ matrix.flavor }}
          path: android/app/build/outputs/androidTest-results

  optimized-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 36, apk: dynamic-droid-optimized-apk, file: app-standard-performance.apk, target: default }
          - { api: 37, apk: dynamic-droid-android17-optimized-apk, file: app-android17-performance.apk, target: google_apis }
          - { api: 37, apk: dynamic-droid-optimized-apk, file: app-standard-performance.apk, target: google_apis }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.apk }}
          path: optimized-apk
      - uses: actions/download-artifact@v7
        with:
          name: notification-fixture-apk
          path: notification-fixture
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Find the system image
        id: img
        # Newer SDK packages carry a minor version (android-37.0), older ones do not (android-30).
        run: |
          name=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
            | grep -oE "system-images;android-${{ matrix.api }}(\.[0-9]+)?;${{ matrix.target }};x86_64" | sort -V | tail -1)
          level=$(echo "$name" | cut -d';' -f2 | sed 's/^android-//')
          echo "Using ${name:-${{ matrix.api }}} (level ${level:-${{ matrix.api }}})"
          echo "level=${level:-${{ matrix.api }}}" >> "$GITHUB_OUTPUT"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.img.outputs.level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 2
          disable-animations: false
          script: |
            adb install -r optimized-apk/${{ matrix.file }}
            adb install -r notification-fixture/notification-fixture-debug.apk
            python3 android/ci/smoke_optimized.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: optimized-app-smoke-api-${{ matrix.api }}-${{ matrix.file }}
          path: island-screenshots/optimized*
