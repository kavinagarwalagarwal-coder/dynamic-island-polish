name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Only run these instrumented tests (class or class#method); empty runs all"
        required: false
        default: ""
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      # The permanent signing key, so each download installs as an update over the last one.
      # Set once in Settings -> Secrets and variables -> Actions. Without it, builds still work
      # but each one is signed with a throwaway key (and must be uninstalled to install the next).
      - name: Load the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.DD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DD_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dynamicdroid.jks"
            echo "DD_KEYSTORE=$RUNNER_TEMP/dynamicdroid.jks" >> "$GITHUB_ENV"
            echo "DD_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the permanent key"
          else
            echo "::warning title=No signing key::Add DD_KEYSTORE_BASE64 and DD_KEYSTORE_PASSWORD repo secrets so new builds install as updates."
          fi
      - name: Build APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace -Pkotlin.jvm.target.validation.mode=warning -p android :app:testStandardDebugUnitTest :app:assembleStandardDebug :app:assembleAndroid17Debug :app:assembleStandardPerformance :app:assembleAndroid17Performance :notification-fixture:assembleDebug 2>&1 | tee gradle.log || {
            # GitHub shows at most 10 annotations per step, so send one combined summary.
            summary=$(grep -vE "^> Task " gradle.log | grep -E -A4 "^e: |FAILED|What went wrong|Caused by|OutOfMemory|error:" | grep -vE "^> Task " | head -40 | tr '\n' '|' | sed 's/%/%25/g')
            echo "::error title=Gradle build failed::${summary:0:3800}"
            exit 1
          }

      - name: Show the signing key and version
        run: |
          signer=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for apk in android/app/build/outputs/apk/*/performance/*.apk; do
            echo "$apk"
            "$signer" verify --print-certs "$apk" | grep "SHA-256"
            "${signer%apksigner}aapt2" dump badging "$apk" 2>/dev/null | head -1 || true
          done

      # Standard: the current build (targets Android 15, runs on Android 8 to 17).
      - uses: actions/upload-artifact@v6
        with:
          name: dynamic-droid-debug-apk
          path: android/app/build/outputs/apk/standard/debug/app-standard-debug.apk

      - uses: actions/upload-artifact@v6
        with:
          name: dynamic-droid-optimized-apk
          path: android/app/build/outputs/apk/standard/performance/app-standard-performance.apk

      # Android 17: the same app built for Android 17's rules.
      - uses: actions/upload-artifact@v6
        with:
          name: dynamic-droid-android17-debug-apk
          path: android/app/build/outputs/apk/android17/debug/app-android17-debug.apk

      - uses: actions/upload-artifact@v6
        with:
          name: dynamic-droid-android17-optimized-apk
          path: android/app/build/outputs/apk/android17/performance/app-android17-performance.apk

      - uses: actions/upload-artifact@v6
        with:
          name: notification-fixture-apk
          path: android/notification-fixture/build/outputs/apk/debug/notification-fixture-debug.apk

  render:
    runs-on: ubuntu-latest
    # The emulator suite runs 14-17 minutes; leave room for a slow runner.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          script: |
            mkdir -p island-screenshots
            gradle --no-daemon -p android :notification-fixture:assembleDebug
            adb install -r android/notification-fixture/build/outputs/apk/debug/notification-fixture-debug.apk
            adb shell pm grant com.dynamicdroid.fixture android.permission.POST_NOTIFICATIONS
            gradle --no-daemon -p android :app:connectedStandardDebugAndroidTest ${{ inputs.tests && format('-Pandroid.testInstrumentationRunnerArguments.class={0} -Pandroid.testInstrumentationRunnerArguments.report=1', inputs.tests) || '' }}
            adb pull /sdcard/Pictures/IslandSmoke island-screenshots
      - name: Report failed instrumentation tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("android/app/build/outputs/androidTest-results/**/*.xml", recursive=True):
              for case in ET.parse(path).getroot().iter("testcase"):
                  for f in list(case.iter("failure")) + list(case.iter("error")):
                      text = (f.get("message") or f.text or "").strip().splitlines()
                      print(f"::error title={case.get('classname')}.{case.get('name')}::{' | '.join(text[:6])[:900]}")
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: island-render-checks
          path: |
            island-screenshots
            android/app/build/reports/androidTests
            android/app/build/outputs/androidTest-results

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 26, flavor: Standard, target: default }
          - { api: 30, flavor: Standard, target: default }
          - { api: 37, flavor: Android17, target: google_apis }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"
      - name: Find the system image
        id: img
        # Newer SDK packages carry a minor version (android-37.0), older ones do not (android-30).
        run: |
          name=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
            | grep -oE "system-images;android-${{ matrix.api }}(\.[0-9]+)?;${{ matrix.target }};x86_64" | sort -V | tail -1)
          level=$(echo "$name" | cut -d';' -f2 | sed 's/^android-//')
          echo "Using ${name:-${{ matrix.api }}} (level ${level:-${{ matrix.api }}})"
          echo "level=${level:-${{ matrix.api }}}" >> "$GITHUB_OUTPUT"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.img.outputs.level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          # Android 17 images need at least 4 GB.
          ram-size: 4096M
          disable-animations: false
          script: gradle --no-daemon -p android :app:connected${{ matrix.flavor }}DebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.dynamicdroid.app.DeviceCompatibilityTest
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compatibility-api-${{ matrix.api }}-${{ matrix.flavor }}
          path: android/app/build/outputs/androidTest-results

  optimized-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 36, apk: dynamic-droid-optimized-apk, file: app-standard-performance.apk, target: default, id: io.github.kavinagarwalagarwal.dynamicdroid }
          - { api: 37, apk: dynamic-droid-android17-optimized-apk, file: app-android17-performance.apk, target: google_apis, id: io.github.kavinagarwalagarwal.dynamicdroid.android17 }
          - { api: 37, apk: dynamic-droid-optimized-apk, file: app-standard-performance.apk, target: google_apis, id: io.github.kavinagarwalagarwal.dynamicdroid }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.apk }}
          path: optimized-apk
      - uses: actions/download-artifact@v7
        with:
          name: notification-fixture-apk
          path: notification-fixture
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Find the system image
        id: img
        # Newer SDK packages carry a minor version (android-37.0), older ones do not (android-30).
        run: |
          name=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
            | grep -oE "system-images;android-${{ matrix.api }}(\.[0-9]+)?;${{ matrix.target }};x86_64" | sort -V | tail -1)
          level=$(echo "$name" | cut -d';' -f2 | sed 's/^android-//')
          echo "Using ${name:-${{ matrix.api }}} (level ${level:-${{ matrix.api }}})"
          echo "level=${level:-${{ matrix.api }}}" >> "$GITHUB_OUTPUT"
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ steps.img.outputs.level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 2
          disable-animations: false
          script: |
            adb install -r optimized-apk/${{ matrix.file }}
            adb install -r notification-fixture/notification-fixture-debug.apk
            APP_ID=${{ matrix.id }} python3 android/ci/smoke_optimized.py
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: optimized-app-smoke-api-${{ matrix.api }}-${{ matrix.file }}
          path: island-screenshots/optimized*

  # Every merge to main publishes the APKs as a GitHub release, so the newest build is always one
  # link away (no sign-in, no zip):
  #   .../releases/latest/download/DynamicDroid.apk            (standard)
  #   .../releases/latest/download/DynamicDroid-Android17.apk  (Android 17)
  # Only builds signed with the permanent key are published, so each one installs as an update.
  # The 10 newest stay, to go back a version if one misbehaves.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dynamic-droid-optimized-apk
          path: out/standard
      - uses: actions/download-artifact@v7
        with:
          name: dynamic-droid-android17-optimized-apk
          path: out/android17
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.DD_KEYSTORE_BASE64 != '' && secrets.DD_KEYSTORE_PASSWORD != '' }}
        run: |
          if [ "$SIGNED" != "true" ]; then
            echo "::warning title=Not released::Add the DD_KEYSTORE secrets so builds can be released as updates."
            exit 0
          fi
          cp out/standard/*.apk DynamicDroid.apk
          cp out/android17/*.apk DynamicDroid-Android17.apk
          tag="build-${GITHUB_RUN_NUMBER}"
          printf '%s\n' \
            "Tap **DynamicDroid.apk** on your phone to install or update (settings and permissions stay)." \
            "On Android 16 or 17 you can pick **DynamicDroid-Android17.apk** instead." \
            "" "Built from ${GITHUB_SHA::7}." > notes.md
          gh release create "$tag" DynamicDroid.apk DynamicDroid-Android17.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dynamic Droid 1.7.0.${GITHUB_RUN_NUMBER}" --notes-file notes.md --latest
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
