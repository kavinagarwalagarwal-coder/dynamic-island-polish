name: Export island renders (temporary)
on:
  push:
    branches: [tmp/export-renders]
permissions:
  actions: read
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: island-render-checks
          merge-multiple: true
          run-id: 41312155535
          github-token: ${{ github.token }}
          path: renders
      - run: |
          echo "::warning::$(find renders -type f -name '*.png' | xargs -n1 basename | sort -u | tr '\n' ' ' | cut -c1-900)"
          mkdir out && find renders -type f \( -name 'feature-*.png' -o -name 'live-overlay-*.png' \) -exec cp -f {} out/ \; || echo "::error::copy failed"
          cd out && git init -q -b tmp/island-renders && git add . \
            && git -c user.name=ci -c user.email=ci@example.com commit -qm "Renders" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp/island-renders 2>err.txt || echo "::error::push failed $(tail -c 300 err.txt | tr '\n' ' ')"
