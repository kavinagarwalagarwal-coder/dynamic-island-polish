name: Export island renders (temporary)
on:
  push:
    branches: [tmp/export-renders]
permissions:
  actions: read
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: island-render-checks
          run-id: 41315941107
          github-token: ${{ github.token }}
          path: renders
      - run: |
          for f in $(find renders -type f -name '*.png' | xargs -n1 basename | sort -u); do echo "::warning::$f"; done
          mkdir out
          find renders -type f -name '*.png' -exec cp -f {} out/ \;
          cd out
          git init -q -b tmp/island-renders
          git add .
          git -c user.name=ci -c user.email=ci@example.com commit -qm "Renders"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" tmp/island-renders
